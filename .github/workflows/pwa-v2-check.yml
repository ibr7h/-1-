name: Validate PWA v2

on:
  push:
    branches:
      - pwa-v2
    paths:
      - 'operational-plan-pwa-v2/**'
      - '.github/workflows/pwa-v2-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check operational-plan-pwa-v2/db.js
          node --check operational-plan-pwa-v2/app.js
          node --check operational-plan-pwa-v2/sw.js

      - name: Validate manifest JSON
        run: python3 -m json.tool operational-plan-pwa-v2/manifest.webmanifest > /dev/null

      - name: Verify required PWA files
        run: |
          test -f operational-plan-pwa-v2/index.html
          test -f operational-plan-pwa-v2/app.css
          test -f operational-plan-pwa-v2/app.js
          test -f operational-plan-pwa-v2/db.js
          test -f operational-plan-pwa-v2/sw.js
          test -f operational-plan-pwa-v2/manifest.webmanifest
