name: Mobile A4 print fit

on:
  push:
    paths:
      - '.github/workflows/mobile-print-a4-fix.yml'

permissions:
  contents: write

jobs:
  patch-mobile-print:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch mobile printing and local Tailwind
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('operational-plan-pwa/index.html')
          s = p.read_text(encoding='utf-8')

          # Use the vendored Tailwind runtime instead of the remote CDN.
          s = s.replace(
              '<script src="https://cdn.tailwindcss.com/3.4.17"></script>',
              '<script src="./tailwind-play.js"></script>'
          )

          # Add a mobile-only 78% print profile inside @media print.
          if 'body.mobile-print-fit .page-container' not in s:
              marker = '''            .official-calendar-qr img {
                object-fit: contain !important;
            }
        }
'''
              replacement = '''            .official-calendar-qr img {
                object-fit: contain !important;
            }

            /*
             * Mobile print profile:
             * iOS/Android print dialogs may keep Letter as the physical sheet even
             * when @page requests A4. On phones/tablets we therefore reproduce the
             * empirically correct 78% scaling while leaving desktop printing at 100%.
             * CSS zoom is used because it participates in layout and pagination.
             */
            body.mobile-print-fit,
            body.mobile-print-fit #multi-page-container {
                width: 210mm !important;
                min-width: 210mm !important;
                max-width: 210mm !important;
                margin: 0 auto !important;
                padding: 0 !important;
            }

            body.mobile-print-fit .page-container {
                zoom: 0.78 !important;
                transform: none !important;
                transform-origin: top center !important;
                margin-left: auto !important;
                margin-right: auto !important;
            }
        }
'''
              if marker not in s:
                  raise SystemExit('CSS insertion marker not found')
              s = s.replace(marker, replacement, 1)

          # Add device detection once.
          if 'function isMobilePrintDevice()' not in s:
              js_marker = '''        // ============================================
        // تصدير PDF آمن: كل صفحة A4 تُجهّز منفصلة ثم تُجمع
        // ============================================
'''
              helper = '''        // تحديد ملف الطباعة المناسب حسب الجهاز.
        // iPad قد يرسل User-Agent شبيهًا بالـ Mac، لذلك نعتمد أيضًا على اللمس.
        function isMobilePrintDevice() {
            const ua = navigator.userAgent || '';
            const isIOS = /iPhone|iPad|iPod/i.test(ua) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            const isAndroid = /Android/i.test(ua);
            const isMobileUA = /Mobile/i.test(ua);
            return isIOS || isAndroid || isMobileUA;
        }

        function applyPrintDeviceProfile() {
            document.body.classList.toggle('mobile-print-fit', isMobilePrintDevice());
        }

        // ============================================
        // تصدير PDF آمن: كل صفحة A4 تُجهّز منفصلة ثم تُجمع
        // ============================================
'''
              if js_marker not in s:
                  raise SystemExit('JS helper insertion marker not found')
              s = s.replace(js_marker, helper, 1)

          # Apply the mobile print profile to Save PDF / browser print flow.
          export_marker = '''            } else {
                document.title = 'النظام_التشغيلي_الفترتان_1448';
            }

            // انتظر خط Cairo والصور قبل أن يفتح محرك PDF الأصلي للمتصفح.
'''
          export_replacement = '''            } else {
                document.title = 'النظام_التشغيلي_الفترتان_1448';
            }

            applyPrintDeviceProfile();

            // انتظر خط Cairo والصور قبل أن يفتح محرك PDF الأصلي للمتصفح.
'''
          if 'applyPrintDeviceProfile();\n\n            // انتظر خط Cairo' not in s:
              if export_marker not in s:
                  raise SystemExit('exportToPDF insertion marker not found')
              s = s.replace(export_marker, export_replacement, 1)

          # Replace executePrint so the print profile remains active for the whole
          # native print dialog; restoring after 600 ms was too early on mobile Safari.
          start_token = '        function executePrint(mode) {'
          end_token = '\n        // تمييز الأسبوع الحالي وتاريخ اليوم'
          start = s.find(start_token)
          end = s.find(end_token, start)
          if start == -1 or end == -1:
              raise SystemExit('executePrint function markers not found')

          new_execute = '''        function executePrint(mode) {
            const printRange = document.getElementById('print-page-range').value;
            const previousClasses = document.body.className;

            document.body.classList.remove('print-only-p1', 'print-only-p2');
            if (printRange === 'p1') {
                document.body.classList.add('print-only-p1');
            } else if (printRange === 'p2') {
                document.body.classList.add('print-only-p2');
            }

            if (mode === 'office') {
                document.body.classList.remove('mode-interactive');
                document.body.classList.add('mode-office');
            } else {
                document.body.classList.remove('mode-office');
                document.body.classList.add('mode-interactive');
                refreshInteractiveView();
            }

            applyPrintDeviceProfile();

            const restore = () => {
                document.body.className = previousClasses;
                refreshInteractiveView();
            };

            window.addEventListener('afterprint', restore, { once: true });

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    setTimeout(() => window.print(), 80);
                });
            });

            // احتياط للمتصفحات التي لا تطلق afterprint عند إلغاء نافذة الطباعة.
            setTimeout(() => {
                if (document.body.classList.contains('mobile-print-fit') ||
                    document.body.classList.contains('print-only-p1') ||
                    document.body.classList.contains('print-only-p2')) {
                    restore();
                }
            }, 120000);
        }
'''
          s = s[:start] + new_execute + s[end:]

          p.write_text(s, encoding='utf-8')

          # Force installed PWAs to refresh the cached shell after this print fix.
          sw = Path('operational-plan-pwa/sw.js')
          t = sw.read_text(encoding='utf-8')
          t = t.replace("abu-sula-operational-plan-v3", "abu-sula-operational-plan-v4")
          sw.write_text(t, encoding='utf-8')
          PY

      - name: Commit generated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add operational-plan-pwa/index.html operational-plan-pwa/sw.js
          if ! git diff --cached --quiet; then
            git commit -m "Fix mobile A4 printing at 78 percent scale"
            git push
          fi
