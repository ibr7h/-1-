name: Native A4 print correction

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/vendor-pwa-dependencies.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply native A4 and direct-print patch
        run: python3 scripts/mobile_print_patch.py

      - name: Commit print correction
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add operational-plan-pwa/index.html operational-plan-pwa/sw.js
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Restore 100 percent A4 printing and prevent automatic print blocking'
          git push origin HEAD:main
