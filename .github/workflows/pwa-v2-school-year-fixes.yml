name: Fix PWA v2 school year and interactions

on:
  workflow_dispatch:
  push:
    branches:
      - pwa-v2
    paths:
      - '.github/workflows/pwa-v2-school-year-fixes.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply fixes
        run: python3 scripts/pwa_v2_school_year_fixes.py

      - name: Validate JavaScript
        run: |
          node --check operational-plan-pwa-v2/academic-calendar.js
          node --check operational-plan-pwa-v2/app.js
          node --check operational-plan-pwa-v2/editor.js
          node --check operational-plan-pwa-v2/print-adapter.js
          node --check operational-plan-pwa-v2/sw.js
          node --check operational-plan-pwa/print-bridge-v2.js

      - name: Protect frozen print layout
        run: |
          git diff --exit-code -- operational-plan-pwa/index.html
          if git diff -- operational-plan-pwa/print-bridge-v2.js | grep -E '^[-+].*(@media print|page-container|page-1-signatures|page-2-signatures|ios-print)' ; then
            echo 'Print layout rule change detected; refusing commit.'
            exit 1
          fi

      - name: Commit fixes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add operational-plan-pwa-v2/app.js operational-plan-pwa-v2/editor.js operational-plan-pwa-v2/index.html operational-plan-pwa-v2/sw.js operational-plan-pwa/print-bridge-v2.js
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Fix 1448 school year plan controls and print statuses'
          git push origin HEAD:pwa-v2
