<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>غير متصل — تنبيه المحاليل</title>
<style>
html,body{height:100%;margin:0;background:#0f172a;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}
main{min-height:100%;display:grid;place-items:center;padding:24px;box-sizing:border-box}
.card{max-width:520px;background:#1e293b;border:1px solid #334155;border-radius:20px;padding:24px;text-align:center;box-shadow:0 18px 50px #02061766}
.icon{font-size:48px}.muted{color:#94a3b8;line-height:1.8}button{min-height:44px;border:0;border-radius:12px;padding:10px 18px;background:#0d9488;color:#fff;font-weight:700}
</style>
</head>
<body><main><section class="card">
<div class="icon">💧</div><h1>التطبيق غير متصل بالشبكة</h1>
<p class="muted">إذا سبق فتح التطبيق أثناء الاتصال، يمكن للنسخة المخزنة محليًا الاستمرار. أعد المحاولة عند عودة الاتصال إذا كانت هذه أول زيارة.</p>
<button onclick="location.reload()">إعادة المحاولة</button>
</section></main></body></html>
